<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PERKYMAFIA OS</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{width:100vw;height:100vh;overflow:hidden;font-family:Arial,sans-serif;font-size:12px;background:#000;color:#000;user-select:none}
:root{--c0:#c0c0c0;--c1:#fff;--c2:#808080;--navy:#000080;--desk:#008080;--text:#000}

/* BOOT */
#scr-boot{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
#boot-logo{color:#fff;font-size:26px;font-weight:bold;letter-spacing:6px;margin-bottom:16px}
#boot-lines{color:#0f0;font-family:monospace;font-size:11px;width:420px;height:180px;overflow:hidden}
#boot-bar-wrap{width:300px;height:18px;border:2px solid #fff;margin-top:16px}
#boot-bar{height:100%;width:0;background:#000080}

/* AUTH */
#scr-auth{position:fixed;inset:0;background:var(--desk);display:flex;align-items:center;justify-content:center;z-index:9998}
.auth-win{background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;width:320px;box-shadow:2px 2px 6px #000}
.auth-title{background:var(--navy);color:#fff;padding:4px 8px;font-weight:bold;font-size:12px}
.auth-body{padding:14px}
.auth-body label{display:block;font-size:11px;margin-bottom:2px}
.auth-body input{width:100%;padding:3px 4px;margin-bottom:8px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;font-size:12px}
.auth-body input:focus{outline:1px dotted #000}
.abtn{background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;padding:3px 14px;font-size:12px;cursor:pointer}
.abtn:active{border-color:#808080 #fff #fff #808080}
.auth-err{color:red;font-size:11px;margin-top:6px;min-height:14px}

/* PENDING */
#scr-pending{position:fixed;inset:0;background:var(--desk);display:none;align-items:center;justify-content:center;z-index:9998}
.pend-win{background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;width:340px;box-shadow:2px 2px 6px #000}
.pend-body{padding:20px;text-align:center;line-height:1.7}
.pend-body .big{font-size:40px;margin-bottom:8px}

/* DESKTOP */
#scr-desktop{position:fixed;inset:0 0 28px 0;display:none}
#desktop-bg{position:absolute;inset:0;padding:10px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px}
.desk-icon{width:74px;text-align:center;cursor:pointer;padding:4px;color:#fff;font-size:10px;border:1px solid transparent}
.desk-icon .di{font-size:30px;display:block;margin-bottom:3px;line-height:1}
.desk-icon:hover{background:rgba(0,0,128,.5);border-color:rgba(255,255,255,.4)}
.desk-icon.sel{background:var(--navy);border-color:#fff}

/* TASKBAR */
#taskbar{position:fixed;bottom:0;left:0;right:0;height:28px;background:var(--c0);border-top:2px solid #fff;display:flex;align-items:center;z-index:1000;gap:2px;padding:0 2px;box-shadow:0 -1px 0 #808080}
#btn-start{background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;padding:2px 8px;font-weight:bold;font-size:12px;cursor:pointer;height:22px;white-space:nowrap}
#btn-start:active,#btn-start.open{border-color:#808080 #fff #fff #808080}
#tb-sep{width:2px;height:22px;background:linear-gradient(to right,#808080,#fff);margin:0 2px;flex-shrink:0}
#taskbar-wins{flex:1;display:flex;gap:2px;overflow:hidden;height:22px}
.tb-btn{background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;padding:2px 6px;font-size:11px;cursor:pointer;height:22px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:3px}
.tb-btn:hover{background:#d4d4d4}
.tb-btn.focused{border-color:#808080 #fff #fff #808080;background:#b0b0b0}
#taskbar-tray{display:flex;align-items:center;gap:6px;padding:0 6px;border:2px solid;border-color:#808080 #fff #fff #808080;height:22px;font-size:11px;flex-shrink:0}
#tray-clock{font-size:11px;font-weight:bold;min-width:45px;text-align:center}
#notif-bell{cursor:pointer;position:relative;font-size:13px}
.nbadge{position:absolute;top:-5px;right:-6px;background:red;color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:bold}

/* START MENU */
#start-menu{position:fixed;bottom:28px;left:0;width:210px;z-index:2000;background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;box-shadow:2px 2px 6px #000;display:flex}
.sm-stripe{background:linear-gradient(to top,#000080,#1084d0);width:26px;display:flex;align-items:flex-end;padding-bottom:6px;justify-content:center;flex-shrink:0}
.sm-stripe span{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-weight:bold;font-size:14px;letter-spacing:2px}
.sm-body{flex:1;padding:4px 0}
.sm-item{padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:12px}
.sm-item:hover{background:var(--navy);color:#fff}
.sm-divider{height:1px;background:#808080;margin:2px 4px}

/* CONTEXT MENU */
#ctx-menu{position:fixed;z-index:3000;background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;box-shadow:2px 2px 6px #000;min-width:160px;display:none}
.ctx-item{padding:4px 18px;cursor:pointer;font-size:12px}
.ctx-item:hover{background:var(--navy);color:#fff}
.ctx-div{height:1px;background:#808080;margin:2px 4px}

/* WINDOWS */
#wins-container{position:absolute;inset:0;pointer-events:none}
.rwin{position:absolute;background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;box-shadow:2px 2px 8px rgba(0,0,0,.5);pointer-events:all;display:flex;flex-direction:column;min-width:280px;min-height:180px}
.rwin-title{background:var(--navy);color:#fff;padding:3px 4px;display:flex;align-items:center;gap:3px;cursor:move;user-select:none;flex-shrink:0;font-size:12px;font-weight:bold}
.rwin-title.unfocused{background:#808080}
.rwin-title span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbtn{width:16px;height:14px;background:var(--c0);border:1px solid;border-color:#fff #808080 #808080 #fff;cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:Arial}
.wbtn:active{border-color:#808080 #fff #fff #808080}
.rwin-body{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.rwin-grip{position:absolute;bottom:0;right:0;width:12px;height:12px;cursor:se-resize;background:linear-gradient(135deg,transparent 50%,#808080 50%)}
.rwin.minimized{display:none!important}
.rwin.maximized{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:calc(100vh - 28px)!important}

/* ALT-TAB */
#alt-tab-overlay{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center}
#alt-tab-list{background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;padding:10px;display:flex;gap:8px;flex-wrap:wrap;max-width:600px;box-shadow:2px 2px 8px #000}
.at-item{width:80px;text-align:center;padding:8px 4px;cursor:pointer;border:2px solid transparent;font-size:10px}
.at-item.active{border-color:var(--navy);background:rgba(0,0,128,.12)}
.at-icon{font-size:26px;display:block;margin-bottom:3px}

/* TOASTS */
#notif-toasts{position:fixed;bottom:36px;right:8px;z-index:4000;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.toast{background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;padding:7px 12px;font-size:11px;max-width:280px;box-shadow:2px 2px 4px #000;animation:tslide .2s ease}
.toast-ttl{font-weight:bold;margin-bottom:2px}
.toast.info .toast-ttl{color:var(--navy)}
.toast.ok .toast-ttl{color:#006600}
.toast.err .toast-ttl{color:#cc0000}
@keyframes tslide{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* WALLPAPER PICKER */
#wp-modal{position:fixed;inset:0;z-index:4500;background:rgba(0,0,0,.5);align-items:center;justify-content:center;display:none}
.wp-win{background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;width:360px;box-shadow:2px 2px 8px #000}
.wp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px}
.wp-opt{height:48px;border:3px solid transparent;cursor:pointer;border-radius:1px}
.wp-opt:hover{border-color:#808080}
.wp-opt.sel{border-color:var(--navy)}

/* GENERIC WIN TOOLS */
.win-tb{background:var(--c0);border-bottom:1px solid #808080;padding:4px 6px;display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;align-items:center}
.rbtn{background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;padding:2px 8px;font-size:11px;cursor:pointer;font-family:Arial}
.rbtn:active{border-color:#808080 #fff #fff #808080}
.rbtn.danger{color:#cc0000}
.rsel,.rinp{border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;padding:2px 4px;font-size:11px;height:22px;font-family:Arial}
.rsel:focus,.rinp:focus{outline:1px dotted #000}

/* PKM */
.pkm-app{display:flex;flex-direction:column;height:100%}
.pkm-tabs{display:flex;border-bottom:2px solid #808080;flex-shrink:0;background:var(--c0)}
.pkm-tab{padding:4px 12px;cursor:pointer;font-size:11px;border:1px solid #808080;border-bottom:none;margin-bottom:-1px;background:#b0b0b0;position:relative;top:1px}
.pkm-tab.on{background:var(--c0);font-weight:bold;z-index:1;border-bottom:2px solid var(--c0)}
.pkm-content{flex:1;overflow:auto;min-height:0}

/* PKM TABLE */
.rtable{width:100%;border-collapse:collapse;font-size:11px}
.rtable th{background:var(--navy);color:#fff;padding:4px 6px;text-align:left;position:sticky;top:0;z-index:1}
.rtable td{padding:4px 6px;border-bottom:1px solid #d8d8d8;cursor:pointer}
.rtable tr:hover td{background:#eeeef8}
.ebadge{display:inline-block;padding:1px 6px;border-radius:2px;font-size:10px;font-weight:bold;border:1px solid}

/* KANBAN */
.kanban-wrap{display:flex;gap:8px;padding:8px;height:100%;overflow-x:auto;align-items:flex-start}
.k-col{min-width:170px;max-width:190px;flex-shrink:0;background:#b8b8b8;border:1px solid #808080;display:flex;flex-direction:column;max-height:100%}
.k-col-h{padding:5px 8px;font-weight:bold;font-size:10px;text-transform:uppercase;background:var(--navy);color:#fff;letter-spacing:1px}
.k-cards{flex:1;padding:4px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;min-height:60px}
.k-card{background:#fff;border:1px solid #999;padding:5px 7px;cursor:grab;font-size:11px;box-shadow:1px 1px 2px rgba(0,0,0,.2)}
.k-card:active{cursor:grabbing;opacity:.8}
.k-card-t{font-weight:bold;margin-bottom:2px}
.k-card-a{font-size:10px;color:#666}
.k-col.drag-over{background:#c8c8e8}

/* PKM TIMELINE */
.timeline-wrap{padding:10px;overflow-y:auto;height:100%}
.tl-song{border-left:3px solid var(--navy);margin-bottom:16px;padding-left:10px}
.tl-song-title{font-weight:bold;font-size:12px;margin-bottom:4px}
.tl-entries{display:flex;flex-direction:column;gap:3px}
.tl-entry{display:flex;gap:8px;align-items:center;font-size:10px}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tl-date{color:#666;min-width:80px}
.tl-estado{font-weight:bold}

/* PKM STATS */
.pkm-stats-wrap{padding:10px}
.stat-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-tile{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:10px;text-align:center}
.stat-num{font-size:28px;font-weight:bold;color:var(--navy)}
.stat-lbl{font-size:10px;color:#555;margin-top:2px}
.bar-chart{display:flex;flex-direction:column;gap:4px}
.bar-row{display:flex;align-items:center;gap:6px;font-size:11px}
.bar-lbl{width:130px;text-align:right;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.bar-track{flex:1;height:14px;background:#e0e0e0;border:1px solid #999}
.bar-fill{height:100%;background:var(--navy)}
.bar-val{width:25px;font-size:10px;color:#333}

/* MODAL */
.modal-ov{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center}
.modal-win{background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff;width:520px;max-height:90%;display:flex;flex-direction:column;box-shadow:4px 4px 10px rgba(0,0,0,.5);max-width:96vw}
.modal-ttl{background:var(--navy);color:#fff;padding:4px 8px;font-weight:bold;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;font-size:12px}
.modal-body{flex:1;overflow:auto;padding:12px}
.modal-foot{padding:8px 12px;border-top:1px solid #808080;display:flex;gap:6px;justify-content:flex-end;flex-shrink:0}
.mtabs{display:flex;border-bottom:1px solid #808080;margin-bottom:10px}
.mtab{padding:3px 10px;cursor:pointer;font-size:11px;border:1px solid #808080;border-bottom:none;background:#b0b0b0}
.mtab.on{background:var(--c0);font-weight:bold;border-bottom:2px solid var(--c0);margin-bottom:-1px}
.modal-body label{display:block;font-size:11px;font-weight:bold;margin-bottom:2px}
.modal-body input,.modal-body select,.modal-body textarea{width:100%;padding:3px 4px;margin-bottom:8px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;font-size:11px;font-family:Arial}
.modal-body textarea{resize:vertical;min-height:55px}
.frow{display:flex;gap:8px}
.frow>*{flex:1;min-width:0}

/* LINK/TASK/COMMENT items */
.litem,.titem,.citem{display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid #e0e0e0;font-size:11px}
.litem a{color:var(--navy);text-decoration:underline;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.titem.done span.t-txt{text-decoration:line-through;color:#888}
.t-assign{font-size:10px;color:#666;font-style:italic;margin-left:auto;flex-shrink:0}
.citem{flex-direction:column;align-items:flex-start;gap:3px}
.c-hdr{display:flex;gap:8px;align-items:center}
.c-name{font-weight:bold;font-size:11px}
.c-date{font-size:10px;color:#888}
.c-text{font-size:11px;line-height:1.4}

/* CHAT */
.chat-app{display:flex;flex-direction:column;height:100%}
.chat-msgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;background:#fff;min-height:0}
.chat-msg{display:flex;gap:6px;align-items:flex-start;max-width:82%}
.chat-msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg-av{width:28px;height:28px;background:var(--navy);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0}
.msg-bdy{max-width:100%}
.msg-meta{font-size:9px;color:#666;margin-bottom:2px}
.msg-txt{background:var(--c0);border:1px solid #999;padding:4px 8px;font-size:11px;word-break:break-word}
.chat-msg.mine .msg-txt{background:#cce8ff}
.chat-in{display:flex;gap:4px;padding:6px;border-top:1px solid #808080;flex-shrink:0;background:var(--c0)}
.chat-in input{flex:1;padding:4px 6px;border:2px solid;border-color:#808080 #fff #fff #808080;font-size:12px}

/* AGENDA */
.agenda-app{display:flex;flex-direction:column;height:100%}
.agenda-main{flex:1;display:flex;overflow:hidden;min-height:0}
.agenda-cal{width:265px;flex-shrink:0;border-right:1px solid #808080;padding:8px;overflow-y:auto;background:var(--c0)}
.agenda-side{flex:1;overflow-y:auto;padding:8px;background:#f0f0f0}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:bold;font-size:12px}
.cal-nav{background:var(--c0);border:1px solid #808080;padding:1px 6px;cursor:pointer;font-size:11px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-dn{text-align:center;font-size:10px;font-weight:bold;padding:2px;color:var(--navy)}
.cal-d{text-align:center;font-size:11px;padding:3px 1px;cursor:pointer;min-height:28px;border:1px solid transparent;position:relative}
.cal-d:hover{background:#e0e0e0}
.cal-d.today{background:var(--navy);color:#fff}
.cal-d.sel{border-color:var(--navy)}
.cal-d.other{color:#bbb}
.evt-dot{width:5px;height:5px;border-radius:50%;margin:1px auto 0}
.evt-item{background:var(--c0);border:1px solid #999;padding:5px 8px;margin-bottom:6px;font-size:11px;position:relative}
.evt-item .et{font-weight:bold}
.evt-item .em{font-size:10px;color:#555;margin-top:2px}
.evt-session{border-left:3px solid #000080}
.evt-deadline{border-left:3px solid #cc0000}
.evt-release{border-left:3px solid #006600}
.evt-event{border-left:3px solid #806000}
.evt-other{border-left:3px solid #808080}

/* NOTES */
.notes-app{display:flex;height:100%}
.notes-list{width:190px;flex-shrink:0;border-right:1px solid #808080;overflow-y:auto;background:#e8e8e8;display:flex;flex-direction:column}
.notes-list-tb{padding:4px;border-bottom:1px solid #808080;flex-shrink:0}
.note-item{padding:7px 8px;border-bottom:1px solid #c0c0c0;cursor:pointer;font-size:11px}
.note-item:hover{background:#d0d0d0}
.note-item.on{background:var(--navy);color:#fff}
.note-item .ni-t{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item .ni-d{font-size:9px;color:#888;margin-top:2px}
.note-item.on .ni-d{color:#aac}
.notes-ed{flex:1;display:flex;flex-direction:column}
.notes-ed-title{padding:4px 8px;border-bottom:1px solid #808080;background:var(--c0);flex-shrink:0}
.notes-ed-title input{width:100%;border:none;background:transparent;font-size:13px;font-weight:bold;font-family:Arial}
.notes-ed-title input:focus{outline:none}
.notes-ed textarea{flex:1;resize:none;border:none;padding:8px;font-size:12px;font-family:monospace;background:#fff}
.notes-ed textarea:focus{outline:none}
.notes-ed-ft{padding:3px 8px;background:var(--c0);border-top:1px solid #808080;font-size:10px;color:#666;display:flex;justify-content:space-between;flex-shrink:0}
.notes-empty{flex:1;display:flex;align-items:center;justify-content:center;color:#666;font-size:12px;background:#fff}

/* STATS */
.stats-app{padding:10px;overflow-y:auto;height:100%}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--c0);border:2px solid;border-color:#808080 #fff #fff #808080;padding:10px;text-align:center}
.kpi-n{font-size:28px;font-weight:bold;color:var(--navy)}
.kpi-l{font-size:10px;color:#555;margin-top:2px}
.ss{margin-bottom:14px}
.ss h3{font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #808080;padding-bottom:3px;margin-bottom:8px;color:var(--navy)}
.top-row{display:flex;gap:8px;align-items:center;font-size:11px;padding:3px 0;border-bottom:1px solid #e0e0e0}
.top-name{flex:1;font-weight:bold}
.top-num{color:var(--navy)}

/* PROFILE */
.profile-app{padding:16px;overflow-y:auto;height:100%}
.prof-hdr{display:flex;gap:14px;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #808080}
.prof-av{width:60px;height:60px;background:var(--navy);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid #808080;flex-shrink:0}
.pf label{display:block;font-size:11px;font-weight:bold;margin-bottom:2px}
.pf input,.pf textarea{width:100%;padding:3px 6px;margin-bottom:10px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;font-size:12px;font-family:Arial}

/* ADMIN */
.admin-app{padding:8px;overflow:auto;height:100%}
.admin-table{width:100%;border-collapse:collapse;font-size:11px}
.admin-table th{background:var(--navy);color:#fff;padding:4px 8px;text-align:left;position:sticky;top:0}
.admin-table td{padding:4px 8px;border-bottom:1px solid #d0d0d0;vertical-align:middle}
.admin-table tr:hover td{background:#f0f0f8}

/* MI PANEL */
.panel-app{padding:10px;overflow-y:auto;height:100%}
.panel-section{margin-bottom:16px}
.panel-section h3{font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid var(--navy);padding-bottom:3px;margin-bottom:8px;color:var(--navy)}
.panel-task{display:flex;gap:8px;align-items:center;padding:5px 8px;border:1px solid #d0d0d0;margin-bottom:4px;background:#fff;font-size:11px;cursor:pointer}
.panel-task:hover{background:#eeeef8}
.panel-task .pt-song{font-weight:bold;flex:1}
.panel-task .pt-task{flex:2;color:#333}
.panel-task .pt-badge{font-size:9px;padding:1px 5px;border-radius:2px;border:1px solid}
.panel-empty{color:#888;font-size:11px;padding:6px 0}
.prog-mini{height:4px;background:#e0e0e0;border-radius:2px;margin-top:3px;overflow:hidden}
.prog-mini-fill{height:100%;background:var(--navy);border-radius:2px}
.prog-pct{font-size:9px;color:#666;margin-left:4px}

/* ACTIVIDAD */
.act-app{padding:10px;overflow-y:auto;height:100%}
.act-day{font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;color:#666;margin:10px 0 5px;padding-bottom:3px;border-bottom:1px solid #ddd}
.act-item{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;margin-bottom:3px;background:#fff;border:1px solid #e0e0e0;font-size:11px}
.act-av{width:24px;height:24px;background:var(--navy);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;flex-shrink:0}
.act-body{flex:1}
.act-who{font-weight:bold}
.act-what{color:#333}
.act-song{color:var(--navy);font-style:italic}
.act-time{font-size:9px;color:#888;flex-shrink:0}

/* SPRINT */
.sprint-app{display:flex;flex-direction:column;height:100%}
.sprint-main{flex:1;display:flex;overflow:hidden;min-height:0}
.sprint-left{width:260px;flex-shrink:0;border-right:1px solid #808080;overflow-y:auto;background:#e8e8e8}
.sprint-right{flex:1;overflow-y:auto;padding:10px;background:#f5f5f5}
.sprint-left-h{padding:6px 8px;font-weight:bold;font-size:11px;border-bottom:1px solid #808080;background:var(--c0)}
.sprint-song-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid #d0d0d0;font-size:11px;cursor:pointer}
.sprint-song-item:hover{background:#d8d8d8}
.sprint-song-item input[type=checkbox]{flex-shrink:0}
.sprint-card{background:#fff;border:1px solid #999;padding:8px 10px;margin-bottom:8px;box-shadow:1px 1px 3px rgba(0,0,0,.15)}
.sprint-card-title{font-weight:bold;font-size:12px;margin-bottom:4px}
.sprint-stage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:6px}
.sprint-stage{font-size:10px;text-align:center;padding:2px 4px;border:1px solid;border-radius:2px}
.sprint-stage.done{background:#d4edda;color:#155724;border-color:#155724}
.sprint-stage.todo{background:#f8f8f8;color:#888;border-color:#ddd}

/* PRODUCTION STAGES */
.stage-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #eee;font-size:11px}
.stage-row input[type=checkbox]{flex-shrink:0}
.stage-name{width:80px;font-weight:bold}
.stage-assign{flex:1}
.stage-assign select{width:100%;border:1px solid #999;background:#fff;padding:2px;font-size:10px}
.prod-prog{height:12px;background:#e0e0e0;border:1px solid #999;margin-bottom:12px;overflow:hidden;position:relative}
.prod-prog-fill{height:100%;background:linear-gradient(to right,#000080,#1084d0);transition:width .3s}
.prod-prog-lbl{position:absolute;right:4px;top:0;font-size:9px;line-height:12px;color:#000;font-weight:bold}

/* SCROLLBARS */
::-webkit-scrollbar{width:16px;height:16px}
::-webkit-scrollbar-track{background:var(--c0)}
::-webkit-scrollbar-thumb{background:var(--c0);border:2px solid;border-color:#fff #808080 #808080 #fff}
::-webkit-scrollbar-button{background:var(--c0);border:1px solid #808080;display:block;height:16px;width:16px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script>
// ===== CONFIG =====
const SB_URL='https://gwycdrnwkzmoxbxcqxih.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3eWNkcm53a3ptb3hieGNxeGloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzgyNDEsImV4cCI6MjA5NDYxNDI0MX0.fTm-TesEgil6NjaiiCspZdjMCX6PxAclFhlPs6PNngc';
const SB=supabase.createClient(SB_URL,SB_KEY);

const ESTADOS=['Idea','Grabando','Mezcla','Masterizado','Listo para publicar','Publicado'];
const ECOLORS={Idea:'#e8e8e8',Grabando:'#fff3cd',Mezcla:'#cce5ff',Masterizado:'#d4edda','Listo para publicar':'#d1ecf1',Publicado:'#000080'};
const ETCOLORS={Idea:'#333',Grabando:'#856404',Mezcla:'#004085',Masterizado:'#155724','Listo para publicar':'#0c5460',Publicado:'#fff'};
const ETYPES={session:{label:'Sesión',icon:'🎙️',cls:'evt-session'},deadline:{label:'Deadline',icon:'⏰',cls:'evt-deadline'},release:{label:'Release',icon:'🚀',cls:'evt-release'},event:{label:'Evento',icon:'🎪',cls:'evt-event'},other:{label:'Otro',icon:'📌',cls:'evt-other'}};
const WALLS=[
  {id:'teal',label:'Teal',css:'#008080'},{id:'navy',label:'Marino',css:'#000050'},
  {id:'dark',label:'Oscuro',css:'#1a1a2e'},{id:'purple',label:'Púrpura',css:'linear-gradient(135deg,#2d0050,#6a0080)'},
  {id:'forest',label:'Bosque',css:'linear-gradient(135deg,#1a3a1a,#2a6a2a)'},{id:'sunset',label:'Atardecer',css:'linear-gradient(135deg,#1a0030,#800040,#cc4000)'},
  {id:'space',label:'Espacio',css:'radial-gradient(ellipse at top,#0a0a2e,#000)'},{id:'wine',label:'Vino',css:'linear-gradient(135deg,#3d0020,#800040)'}
];

// ===== STATE =====
let CU=null,CP=null;
let songs=[],artists=[],profiles=[],messages=[],notes=[],events=[];
let PM={};// profiles map by id
let wins={},zTop=100,focId=null;
let pkmTab='tabla',pkmQ='',mTab='general',curSong=null;
let agDate=new Date(),agSel=null;
let selNoteId=null;
let chatSub=null,noteTimer=null,unread=0,atIdx=0;
let CWall=localStorage.getItem('pkm_wall')||'teal';

// ===== UTILS =====
const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtD(d){if(!d)return'';const dt=new Date(d);return dt.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'})}
function fmtT(d){if(!d)return'';const dt=new Date(d);return dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}
function fmtDT(d){return fmtD(d)+' '+fmtT(d)}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function pname(uid){const p=PM[uid];return p?(p.artist_name||p.nombre||p.email||'?'):'?'}
function pinitial(uid){return pname(uid).charAt(0).toUpperCase()}

function showScreen(id){
  ['scr-boot','scr-auth','scr-pending','scr-desktop'].forEach(s=>{
    const e=$(s);if(!e)return;
    if(s===id){e.style.display=s==='scr-desktop'?'block':'flex';e.hidden=false;}
    else{e.style.display='none';e.hidden=true;}
  });
  // Cierra cualquier modal o menú residual al cambiar de pantalla
  if(id==='scr-desktop'){
    const mod=$('mod-ov');if(mod)mod.remove();
    const cm=$('ctx-menu');if(cm)cm.style.display='none';
    const sm=$('start-menu');if(sm)sm.hidden=true;
  }
}

// ===== BOOT =====
let _bootDone=false;
function boot(){
  const lines=['Iniciando PERKYMAFIA OS v2.0...','Cargando módulos de audio...','Conectando con la base de datos...','Inicializando gestor de temas...','Cargando interfaz de usuario...','Sistema listo.'];
  const bl=$('boot-lines'),bar=$('boot-bar');
  let i=0;
  function step(){
    if(i<lines.length){
      bl.innerHTML+=lines[i]+'<br>';i++;
      bar.style.width=(i/lines.length*100)+'%';
      setTimeout(step,300+Math.random()*200);
    } else {
      _bootDone=true;
      // Si onAuthStateChange ya cargó al usuario durante el boot, va al desktop
      if(CU){showScreen('scr-desktop');return;}
      showScreen('scr-auth');
    }
  }
  setTimeout(step,400);
}

// ===== AUTH =====
function showLogin(){$('f-login').hidden=false;$('f-reg').hidden=true;}
function showReg(){$('f-login').hidden=true;$('f-reg').hidden=false;}

async function doLogin(){
  const email=$('l-email').value.trim(),pass=$('l-pass').value;
  const errEl=$('l-err');errEl.textContent='';errEl.style.color='red';
  if(!email||!pass){errEl.textContent='Completa todos los campos';return;}
  const btn=$('btn-login');if(btn)btn.disabled=true;
  errEl.style.color='#555';errEl.textContent='Conectando con Supabase...';
  const tout=new Promise((_,r)=>setTimeout(()=>r(new Error('⏱️ Sin respuesta (30s). Comprueba tu conexión e inténtalo de nuevo.')),30000));
  try{
    const res=await Promise.race([SB.auth.signInWithPassword({email,password:pass}),tout]);
    if(res.error){
      errEl.style.color='red';
      const msg=res.error.message;
      if(msg.includes('Invalid login')||msg.includes('invalid_credentials')){
        errEl.textContent='❌ Email o contraseña incorrectos. ¿Olvidaste la contraseña?';
      } else if(msg.includes('Email not confirmed')){
        errEl.textContent='⚠️ Confirma tu email primero (revisa tu bandeja de entrada).';
      } else {
        errEl.textContent='❌ '+msg;
      }
    } else {
      errEl.style.color='green';errEl.textContent='✅ Entrando...';
    }
  }catch(e){
    errEl.style.color='red';errEl.textContent=e.message;
  }finally{if(btn)btn.disabled=false;}
}

async function doRegister(){
  const nombre=$('r-nombre').value.trim(),email=$('r-email').value.trim(),pass=$('r-pass').value;
  const errEl=$('r-err');errEl.textContent='';errEl.style.color='red';
  if(!nombre||!email||!pass){errEl.textContent='Completa todos los campos';return;}
  if(pass.length<6){errEl.textContent='Contraseña mínimo 6 caracteres';return;}
  errEl.style.color='#555';errEl.textContent='Creando cuenta...';
  const tout=new Promise((_,r)=>setTimeout(()=>r(new Error('⏱️ Sin respuesta. Comprueba tu conexión.')),30000));
  try{
    const{error}=await Promise.race([SB.auth.signUp({email,password:pass,options:{data:{nombre}}}),tout]);
    if(error){errEl.style.color='red';errEl.textContent='❌ '+error.message;return;}
    errEl.style.color='green';errEl.textContent='✅ Cuenta creada. Ya puedes iniciar sesión.';
    setTimeout(()=>{showLogin();$('l-email').value=email;},1500);
  }catch(e){errEl.style.color='red';errEl.textContent=e.message;}
}

async function doResetPwd(){
  const email=$('l-email').value.trim();
  const errEl=$('l-err');
  if(!email){errEl.style.color='red';errEl.textContent='Escribe tu email primero';return;}
  errEl.style.color='#555';errEl.textContent='Enviando enlace de recuperación...';
  try{
    const{error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});
    if(error){errEl.style.color='red';errEl.textContent='❌ '+error.message;}
    else{errEl.style.color='green';errEl.textContent='📧 ¡Revisa tu email! Te hemos enviado un enlace para restablecer la contraseña.';}
  }catch(e){errEl.style.color='red';errEl.textContent='Error: '+e.message;}
}

async function loadUserData(user){
  try{
    CU=user;
    const{data:p,error:pe}=await SB.from('profiles').select('*').eq('id',user.id).single();
    if(pe||!p){showScreen('scr-pending');return;}
    if(p.email==='asarap08@gmail.com'&&(!p.approved||p.role!=='admin')){
      await SB.from('profiles').update({approved:true,role:'admin'}).eq('id',user.id);
      p.approved=true;p.role='admin';
    }
    CP=p;
    if(!p.approved){showScreen('scr-pending');return;}
    await Promise.all([
      loadSongs().catch(()=>{}),
      loadArtists().catch(()=>{}),
      loadProfiles().catch(()=>{}),
      loadMessages().catch(()=>{}),
      loadNotes().catch(()=>{}),
      loadEvents().catch(()=>{}),
      loadActivityLog().catch(()=>{})
    ]);
    setupDesktop();
    setupRealtime();
    if(_bootDone)showScreen('scr-desktop');
  }catch(e){
    console.error('loadUserData error:',e);
    showScreen('scr-auth');
    const errEl=$('l-err');
    if(errEl){errEl.style.color='red';errEl.textContent='Error al cargar: '+e.message;}
  }
}

let _loadingUser=false;
SB.auth.onAuthStateChange(async(ev,sess)=>{
  if((ev==='SIGNED_IN'||ev==='INITIAL_SESSION'||ev==='TOKEN_REFRESHED')&&sess){
    if(_loadingUser)return;
    _loadingUser=true;
    try{await loadUserData(sess.user);}finally{_loadingUser=false;}
  } else if(ev==='PASSWORD_RECOVERY'&&sess){
    // Usuario viene del enlace de reset de contraseña
    showScreen('scr-auth');showLogin();
    const errEl=$('l-err');
    errEl.style.color='#000080';
    errEl.innerHTML='🔑 Introduce tu nueva contraseña abajo:<br><input type="password" id="new-pwd" placeholder="Nueva contraseña" style="width:100%;margin-top:4px;padding:3px;border:2px solid #808080"><br><button class="abtn" style="margin-top:4px" onclick="confirmNewPwd()">Guardar contraseña</button>';
  } else if(ev==='SIGNED_OUT'){
    CU=null;CP=null;cleanupRealtime();showScreen('scr-auth');showLogin();
  }
});

async function confirmNewPwd(){
  const pwd=($('new-pwd')||{}).value;
  if(!pwd||pwd.length<6){return;}
  const{error}=await SB.auth.updateUser({password:pwd});
  const errEl=$('l-err');
  if(error){errEl.style.color='red';errEl.textContent='❌ '+error.message;}
  else{errEl.style.color='green';errEl.textContent='✅ Contraseña actualizada. Iniciando sesión...';}
}

// ===== DATA =====
async function loadSongs(){const{data}=await SB.from('songs').select('*').order('updated_at',{ascending:false,nullsFirst:false});songs=data||[];}
async function loadArtists(){const{data}=await SB.from('artists').select('*').order('nombre');artists=data||[];}
async function loadProfiles(){
  const{data}=await SB.from('profiles').select('*').order('nombre');
  profiles=data||[];
  PM={};profiles.forEach(p=>PM[p.id]=p);
}
async function loadMessages(){const{data}=await SB.from('messages').select('*').order('created_at').limit(200);messages=data||[];}
async function loadNotes(){const{data}=await SB.from('notes').select('*').order('updated_at',{ascending:false});notes=data||[];}
async function loadEvents(){const{data}=await SB.from('events').select('*').order('event_date');events=data||[];}

// ===== REALTIME =====
function setupRealtime(){
  chatSub=SB.channel('rt-messages')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},pl=>{
      const msg=pl.new;
      messages.push(msg);
      if(wins['chat']&&!wins['chat'].minimized&&focId==='chat'){
        renderChatMsgs();
      } else {
        const name=pname(msg.user_id);
        notify('💬 '+name,msg.content.slice(0,60)+(msg.content.length>60?'…':''),'info');
        if(msg.user_id!==CU.id){unread++;updateChatBadge();}
      }
      if(wins['chat'])renderChatMsgs();
    })
    .subscribe();
}
function cleanupRealtime(){if(chatSub)SB.removeChannel(chatSub);}

// ===== WINDOW MANAGER =====
function mkWin(id,title,icon,w,h,html){
  if(wins[id]){
    if(wins[id].minimized)unmin(id);
    focusWin(id);return;
  }
  const wc=$('wins-container');
  const x=40+Object.keys(wins).length*20,y=30+Object.keys(wins).length*18;
  const div=document.createElement('div');
  div.className='rwin';div.id='win-'+id;
  div.style.cssText=`left:${Math.min(x,200)}px;top:${Math.min(y,100)}px;width:${w}px;height:${h}px;z-index:${++zTop}`;
  div.innerHTML=`
    <div class="rwin-title" id="wt-${id}">
      <span>${icon} ${esc(title)}</span>
      <button class="wbtn" onclick="minWin('${id}')" title="Minimizar">_</button>
      <button class="wbtn" onclick="maxWin('${id}')" title="Max/Restaurar">□</button>
      <button class="wbtn" onclick="closeWin('${id}')" title="Cerrar">✕</button>
    </div>
    <div class="rwin-body" id="wb-${id}">${html}</div>
    <div class="rwin-grip" id="wg-${id}"></div>`;
  wc.appendChild(div);
  wins[id]={el:div,title:title,icon:icon,minimized:false,maximized:false};
  makeDrag($('wt-'+id),div);
  makeResize($('wg-'+id),div);
  focusWin(id);
  tbRefresh();
}

function focusWin(id){
  if(!wins[id])return;
  wins[id].el.style.zIndex=++zTop;
  Object.keys(wins).forEach(k=>{
    const t=$('wt-'+k);
    if(t)t.classList.toggle('unfocused',k!==id);
  });
  focId=id;tbRefresh();
}

function minWin(id){
  if(!wins[id])return;
  wins[id].minimized=true;
  wins[id].el.classList.add('minimized');
  focId=null;tbRefresh();
  if(id==='chat'){unread=0;updateChatBadge();}
}

function unmin(id){
  if(!wins[id])return;
  wins[id].minimized=false;
  wins[id].el.classList.remove('minimized');
  focusWin(id);
  if(id==='chat'){unread=0;updateChatBadge();}
}

function maxWin(id){
  if(!wins[id])return;
  const w=wins[id];const e=w.el;
  if(w.maximized){
    e.classList.remove('maximized');
    e.style.left=w.px+'px';e.style.top=w.py+'px';
    e.style.width=w.pw+'px';e.style.height=w.ph+'px';
    w.maximized=false;
  } else {
    w.px=e.offsetLeft;w.py=e.offsetTop;w.pw=e.offsetWidth;w.ph=e.offsetHeight;
    e.classList.add('maximized');w.maximized=true;
  }
  focusWin(id);
}

function closeWin(id){
  if(!wins[id])return;
  wins[id].el.remove();
  delete wins[id];
  if(focId===id)focId=null;
  tbRefresh();
}

function tbRefresh(){
  const tb=$('taskbar-wins');tb.innerHTML='';
  Object.keys(wins).forEach(id=>{
    const w=wins[id];
    const b=document.createElement('button');
    b.className='tb-btn'+((!w.minimized&&focId===id)?' focused':'');
    b.innerHTML=w.icon+' '+esc(w.title);
    b.onclick=()=>{if(!w.minimized&&focId===id)minWin(id);else if(w.minimized)unmin(id);else focusWin(id);};
    tb.appendChild(b);
  });
}

function makeDrag(handle,el){
  handle.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('wbtn'))return;
    const id=el.id.replace('win-','');focusWin(id);
    const sx=e.clientX-el.offsetLeft,sy=e.clientY-el.offsetTop;
    const mv=e=>{el.style.left=(e.clientX-sx)+'px';el.style.top=Math.max(0,e.clientY-sy)+'px';};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    e.preventDefault();
  });
}

function makeResize(grip,el){
  grip.addEventListener('mousedown',e=>{
    e.stopPropagation();
    const sw=el.offsetWidth,sh=el.offsetHeight,sx=e.clientX,sy=e.clientY;
    const mv=e=>{
      el.style.width=Math.max(300,sw+(e.clientX-sx))+'px';
      el.style.height=Math.max(200,sh+(e.clientY-sy))+'px';
    };
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    e.preventDefault();
  });
}

function filteredSongs(){
  const q=($('pkm-search')||{value:''}).value.toLowerCase();
  const fe=($('pkm-filter-estado')||{value:''}).value;
  return songs.filter(s=>{
    const arts=(s.artistas||[]).join(', ').toLowerCase();
    const ok=(s.titulo||'').toLowerCase().includes(q)||arts.includes(q);
    const oke=!fe||s.estado===fe;
    return ok&&oke;
  });
}

function renderTemas(){
  const c=$('pkm-content');if(!c)return;
  if(pkmTab==='tabla')c.innerHTML=renderTable();
  else if(pkmTab==='kanban'){c.innerHTML='<div class="kanban-wrap" id="kanban-inner"></div>';renderKanban();}
  else if(pkmTab==='timeline'){c.innerHTML='<div class="timeline-wrap">'+renderTimeline()+'</div>';}
  else if(pkmTab==='stats')c.innerHTML=renderStatsTab();
}

function renderTable(){
  const fs=filteredSongs();
  if(!fs.length)return '<div style="padding:20px;color:#666">No hay temas. ¡Añade el primero!</div>';
  return `<table class="rtable"><thead><tr>
    <th>Título</th><th>Artistas</th><th>Estado</th><th>Género</th><th>BPM</th><th>Actualizado</th><th></th>
  </tr></thead><tbody>${fs.map(s=>`
    <tr onclick="openSongModal('${s.id}')">
      <td><strong>${esc(s.titulo)}</strong></td>
      <td>${esc((s.artistas||[]).join(', '))}</td>
      <td><span class="ebadge e-${s.estado.replace(/ /g,'_')}" style="background:${ECOLORS[s.estado]||'#eee'};color:${ETCOLORS[s.estado]||'#000'};border-color:${ETCOLORS[s.estado]||'#999'}">${esc(s.estado)}</span></td>
      <td>${esc(s.genero||'')}</td>
      <td>${s.bpm||''}</td>
      <td>${fmtD(s.updated_at)}</td>
      <td><span style="font-size:10px;color:var(--navy)">${songProgress(s)>0?songProgress(s)+'%':''}</span></td>
      <td onclick="event.stopPropagation()"><button class="rbtn danger" onclick="deleteSong('${s.id}')">✕</button></td>
    </tr>`).join('')}</tbody></table>`;
}

function renderKanban(){
  const kw=$('kanban-inner');if(!kw)return;
  const bySt={};ESTADOS.forEach(e=>bySt[e]=[]);

      <div class="k-cards">

      </div>
    </div>`).join('');
}

function dragKanban(e,id){e.dataTransfer.setData('songId',id);}
async function dropKanban(e,estado){
  e.currentTarget.classList.remove('drag-over');
  const id=e.dataTransfer.getData('songId');if(!id)return;
  const s=songs.find(x=>x.id===id);if(!s||s.estado===estado)return;
  const prev=s.estado;s.estado=estado;
  const hist=[...(s.historial||[]),{date:new Date().toISOString(),estado,prev,user:CP?(CP.artist_name||CP.nombre||CP.email):''}];
  await SB.from('songs').update({estado,historial:hist,updated_at:new Date().toISOString()}).eq('id',id);
  s.historial=hist;renderTemas();
  logActivity('estado_cambio',id,s.titulo,{from:prev,to:estado});
}

function renderTimeline(){
  const fs=[...songs].sort((a,b)=>new Date(b.creado||b.updated_at)-new Date(a.creado||a.updated_at));
  if(!fs.length)return '<div style="padding:20px;color:#666">Sin temas.</div>';
  return fs.map(s=>{
    const hist=s.historial||[];
    const entries=[{date:s.creado||s.updated_at,estado:'Idea',first:true},...hist];
    return `<div class="tl-song">
      <div class="tl-song-title">🎵 ${esc(s.titulo)} <span style="color:#888;font-weight:normal;font-size:10px">${esc((s.artistas||[]).join(', '))}</span></div>
      <div class="tl-entries">${entries.map(h=>`
        <div class="tl-entry">
          <div class="tl-dot" style="background:${ECOLORS[h.estado]||'#999'};border:1px solid ${ETCOLORS[h.estado]||'#666'}"></div>
          <span class="tl-date">${fmtD(h.date)}</span>
          <span class="tl-estado" style="color:${ETCOLORS[h.estado]||'#000'}">${esc(h.estado)}</span>
          ${h.user?`<span style="color:#888;font-size:10px">— ${esc(h.user)}</span>`:''}
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderStatsTab(){
  const total=songs.length,pub=songs.filter(s=>s.estado==='Publicado').length;
  const enProg=songs.filter(s=>s.estado!=='Idea'&&s.estado!=='Publicado').length;
  const maxBar=Math.max(...ESTADOS.map(e=>songs.filter(s=>s.estado===e).length),1);
  const bars=ESTADOS.map(e=>{
    const c=songs.filter(s=>s.estado===e).length;
    const pct=Math.round(c/maxBar*100);
    return `<div class="bar-row"><span class="bar-lbl">${esc(e)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${ECOLORS[e]};border-right:${c>0?'2px solid '+ETCOLORS[e]:'none'}"></div></div><span class="bar-val">${c}</span></div>`;
  }).join('');
  // Top artistas
  const amap={};songs.forEach(s=>(s.artistas||[]).forEach(a=>{amap[a]=(amap[a]||0)+1;}));
  const topArts=Object.entries(amap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<div class="pkm-stats-wrap">
    <div class="stat-tiles">
      <div class="stat-tile"><div class="stat-num">${total}</div><div class="stat-lbl">Total temas</div></div>
      <div class="stat-tile"><div class="stat-num">${pub}</div><div class="stat-lbl">Publicados</div></div>
      <div class="stat-tile"><div class="stat-num">${enProg}</div><div class="stat-lbl">En progreso</div></div>
      <div class="stat-tile"><div class="stat-num">${artists.length}</div><div class="stat-lbl">Artistas</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <div class="ss"><h3>Por estado</h3><div class="bar-chart">${bars}</div></div>
      </div>
      <div>
        <div class="ss"><h3>Top artistas</h3>
          ${topArts.length?topArts.map(([n,c])=>`<div class="top-row"><span class="top-name">${esc(n)}</span><span class="top-num">${c} temas</span></div>`).join(''):'<div style="color:#666;font-size:11px">Sin datos</div>'}
        </div>
        <div class="ss"><h3>Recientes</h3>
          ${songs.slice(0,5).map(s=>`<div class="top-row"><span class="top-name">${esc(s.titulo)}</span><span style="font-size:10px;color:#666">${fmtD(s.updated_at)}</span></div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

        <select id="t-assign" style="flex:1;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;padding:3px;font-size:11px">

        <button class="rbtn" onclick="addTask()">+</button>

  } else if(mTab==='comentarios'){
    const coms=s.comentarios||[];
    c.innerHTML=`
      <div id="coms-list">${coms.map(cm=>`
        <div class="citem">
          <div class="c-hdr">
            <span class="c-name">${esc(cm.nombre)}</span>
            <span class="c-date">${fmtDT(cm.created_at)}</span>

          <div class="c-text">${esc(cm.texto)}</div>

function addLink(){
  const name=$('lk-name').value.trim(),url=$('lk-url').value.trim(),type=$('lk-type').value;
  if(!url)return;
  curSong.links=[...(curSong.links||[]),{id:gid(),name:name||url,url,type}];
  $('lk-name').value='';$('lk-url').value='';
  renderMTabContent(curSong.id);
}
function removeLink(i){curSong.links=(curSong.links||[]).filter((_,j)=>j!==i);renderMTabContent(curSong.id);}

function addTask(){
  const txt=$('t-text').value.trim();if(!txt)return;
  const asel=$('t-assign');
  const assignee_id=asel.value;
  const assignee_name=asel.options[asel.selectedIndex].text==='Sin asignar'?'':asel.options[asel.selectedIndex].text;
  curSong.tareas=[...(curSong.tareas||[]),{id:gid(),texto:txt,done:false,assignee_id,assignee_name,created_at:new Date().toISOString()}];
  $('t-text').value='';renderMTabContent(curSong.id);
}
function toggleTask(i,done){curSong.tareas=(curSong.tareas||[]).map((t,j)=>j===i?{...t,done}:t);renderMTabContent(curSong.id);}
function removeTask(i){curSong.tareas=(curSong.tareas||[]).filter((_,j)=>j!==i);renderMTabContent(curSong.id);}

function addComment(){
  const txt=$('com-text').value.trim();if(!txt)return;
  const nc={id:gid(),user_id:CU.id,nombre:CP.artist_name||CP.nombre||CP.email,texto:txt,created_at:new Date().toISOString()};
  curSong.comentarios=[...(curSong.comentarios||[]),nc];
  $('com-text').value='';renderMTabContent(curSong.id);
  logActivity('comentario',curSong.id||'',curSong.titulo,{});
}
function removeCom(cid){curSong.comentarios=(curSong.comentarios||[]).filter(c=>c.id!==cid);renderMTabContent(curSong.id);}

async function saveSong(id){
  const s=curSong;const isNew=!id;
  const data={
    titulo:s.titulo||'Sin título',artistas:s.artistas||[],estado:s.estado||'Idea',
    prioridad:s.prioridad||'Media',
    bpm:s.bpm||null,tonalidad:s.tonalidad||'',genero:s.genero||'',notas:s.notas||'',
    responsable:CP?CP.artist_name||CP.nombre||'':'',
    checklist:s.checklist||[],spotify:s.spotify||null,soundcloud:s.soundcloud||null,
    historial:s.historial||[],links:s.links||[],tareas:s.tareas||[],comentarios:s.comentarios||[],
    production_stages:s.production_stages||[],
    updated_at:new Date().toISOString()
  };
  if(isNew){data.creado=new Date().toISOString();}
  let error;
  if(isNew){
    const res=await SB.from('songs').insert(data).select('id').single();
    error=res.error;
    if(!error&&res.data)logActivity('tema_nuevo',res.data.id,data.titulo,{});
  } else {
    const res=await SB.from('songs').update(data).eq('id',id);
    error=res.error;
    logActivity('edicion',id,data.titulo,{});
  }
  if(error){notify('Error','No se pudo guardar: '+error.message,'err');return;}
  await loadSongs();closeModal();renderTemas();
  notify('Guardado','Tema guardado correctamente','ok');
}

async function deleteSong(id){
  if(!confirm('¿Eliminar este tema?'))return;
  await SB.from('songs').delete().eq('id',id);
  songs=songs.filter(s=>s.id!==id);closeModal();renderTemas();
  notify('Eliminado','Tema eliminado','ok');
}

function pkmExport(fmt){
  const data=songs;let content,fname,type;
  if(fmt==='json'){content=JSON.stringify(data,null,2);fname='perkymafia_temas.json';type='application/json';}
  else{
    const hdr='Título,Artistas,Estado,BPM,Tonalidad,Género,Notas\n';
    content=hdr+data.map(s=>[s.titulo,(s.artistas||[]).join(';'),s.estado,s.bpm||'',s.tonalidad||'',s.genero||'',(s.notas||'').replace(/,/g,';')].map(x=>`"${x}"`).join(',')).join('\n');
    fname='perkymafia_temas.csv';type='text/csv';
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=fname;a.click();
}

function openAgenda(){
  if(wins['agenda']){if(wins['agenda'].minimized)unmin('agenda');else focusWin('agenda');return;}
  mkWin('agenda','Agenda','📅',700,520,`<div class="agenda-app">
    <div class="win-tb">
      <button class="rbtn" onclick="openEventForm(null)">+ Evento</button>
    </div>
    <div class="agenda-main">
      <div class="agenda-cal" id="ag-cal"></div>
      <div class="agenda-side" id="ag-side"></div>
    </div>
  </div>`);
  agDate=new Date();agSel=null;renderAgenda();
}

function renderAgenda(){
  renderCalendar();renderEvtSide();
}

function renderCalendar(){
  const c=$('ag-cal');if(!c)return;
  const y=agDate.getFullYear(),m=agDate.getMonth();
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const days=['L','M','X','J','V','S','D'];
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  const startDay=(first.getDay()+6)%7;

  const evtDates=new Set(events.filter(e=>{const d=new Date(e.event_date);return d.getFullYear()===y&&d.getMonth()===m;}).map(e=>new Date(e.event_date).getDate()));

  let cells='';
  for(let i=0;i<startDay;i++)cells+=`<div class="cal-d other" style="cursor:default"></div>`;
  for(let d=1;d<=last.getDate();d++){
    const today=new Date(),isToday=d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
    const isSel=agSel&&agSel.d===d&&agSel.m===m&&agSel.y===y;
    const hasEvt=evtDates.has(d);
    cells+=`<div class="cal-d${isToday?' today':''}${isSel?' sel':''}" onclick="selCalDay(${d},${m},${y})">
      ${d}${hasEvt?`<div class="evt-dot" style="background:${isToday?'#fff':'var(--navy)'}"></div>`:''}
    </div>`;
  }

  c.innerHTML=`
    <div class="cal-hdr">
      <button class="cal-nav" onclick="agNav(-1)">◀</button>
      ${months[m]} ${y}
      <button class="cal-nav" onclick="agNav(1)">▶</button>
    </div>
    <div class="cal-grid">
      ${days.map(d=>`<div class="cal-dn">${d}</div>`).join('')}
      ${cells}
    </div>`;
}

function agNav(dir){agDate=new Date(agDate.getFullYear(),agDate.getMonth()+dir,1);renderCalendar();}

function selCalDay(d,m,y){
  agSel={d,m,y};renderCalendar();renderEvtSide();
}

function renderEvtSide(){
  const s=$('ag-side');if(!s)return;
  let evts=events;
  if(agSel){
    evts=events.filter(e=>{const d=new Date(e.event_date);return d.getDate()===agSel.d&&d.getMonth()===agSel.m&&d.getFullYear()===agSel.y;});
    s.innerHTML=`<div style="font-weight:bold;margin-bottom:8px;font-size:12px">📅 ${agSel.d}/${agSel.m+1}/${agSel.y}</div>`+
      (evts.length?evts.map(e=>evtHtml(e)).join(''):
      `<div style="color:#666;font-size:11px">Sin eventos este día. <span style="cursor:pointer;color:var(--navy);text-decoration:underline" onclick="openEventForm(null)">+ Añadir</span></div>`);
  } else {
    const upcoming=events.filter(e=>new Date(e.event_date)>=new Date()).slice(0,10);
    s.innerHTML=`<div style="font-weight:bold;margin-bottom:8px;font-size:12px">Próximos eventos</div>`+
      (upcoming.length?upcoming.map(e=>evtHtml(e)).join(''):
      '<div style="color:#666;font-size:11px">No hay eventos próximos.</div>');
  }
}

function evtHtml(e){
  const t=ETYPES[e.type]||ETYPES.other;
  return `<div class="evt-item evt-${e.type||'other'}">
    <button class="rbtn danger" style="position:absolute;top:4px;right:4px;padding:1px 5px;font-size:10px" onclick="deleteEvent('${e.id}')">✕</button>
    <div class="et">${t.icon} ${esc(e.title)}</div>
    <div class="em">${fmtD(e.event_date)}${e.event_time?' · '+e.event_time:''} · ${esc(pname(e.user_id))}</div>
    ${e.description?`<div style="font-size:10px;margin-top:3px;color:#444">${esc(e.description)}</div>`:''}
  </div>`;
}

function openEventForm(id){
  const ev=id?events.find(x=>x.id===id):null;
  const today=new Date().toISOString().slice(0,10);
  const defaultDate=agSel?`${agSel.y}-${String(agSel.m+1).padStart(2,'0')}-${String(agSel.d).padStart(2,'0')}`:today;
  const html=`<div class="modal-win" style="width:400px">
    <div class="modal-ttl">${ev?'✏️ Editar evento':'➕ Nuevo evento'}<button class="wbtn" style="background:transparent;border:none;color:#fff;font-size:14px" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <label>Título</label><input id="ev-title" value="${esc(ev?.title||'')}">
      <div class="frow">
        <div><label>Fecha</label><input type="date" id="ev-date" value="${ev?.event_date||defaultDate}"></div>
        <div><label>Hora</label><input type="time" id="ev-time" value="${ev?.event_time||''}"></div>
      </div>
      <label>Tipo</label>
      <select id="ev-type" style="width:100%;padding:3px;margin-bottom:8px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;font-size:11px">
        ${Object.entries(ETYPES).map(([k,v])=>`<option value="${k}"${(ev?.type||'other')===k?' selected':''}>${v.icon} ${v.label}</option>`).join('')}
      </select>
      <label>Descripción</label><textarea id="ev-desc">${esc(ev?.description||'')}</textarea>
    </div>
    <div class="modal-foot">
      <button class="rbtn" onclick="closeModal()">Cancelar</button>
      <button class="rbtn" onclick="saveEvent('${id||''}')">💾 Guardar</button>
    </div>
  </div>`;
  openModal('agenda',html);
}

async function saveEvent(id){
  const title=$('ev-title').value.trim();if(!title)return;
  const data={title,event_date:$('ev-date').value,event_time:$('ev-time').value||null,type:$('ev-type').value,description:$('ev-desc').value};
  if(id){await SB.from('events').update(data).eq('id',id);}
  else{data.user_id=CU.id;await SB.from('events').insert(data);}
  await loadEvents();closeModal();renderAgenda();
  notify('Evento','Evento guardado','ok');
}

async function deleteEvent(id){
  if(!confirm('¿Eliminar evento?'))return;
  await SB.from('events').delete().eq('id',id);
  events=events.filter(e=>e.id!==id);renderAgenda();
}

function noteChanged(){
  if(!selNoteId)return;
  clearTimeout(noteTimer);
  noteTimer=setTimeout(()=>autoSaveNote(),1200);
}

async function autoSaveNote(){
  if(!selNoteId)return;
  const title=($('ne-title')||{value:''}).value;
  const content=($('ne-content')||{value:''}).value;
  const{error}=await SB.from('notes').update({title,content,updated_at:new Date().toISOString()}).eq('id',selNoteId);
  if(!error){
    const n=notes.find(x=>x.id===selNoteId);
    if(n){n.title=title;n.content=content;n.updated_at=new Date().toISOString();}
    renderNotesList();
  }
}

async function newNote(){
  const{data,error}=await SB.from('notes').insert({user_id:CU.id,title:'Nueva nota',content:'',updated_at:new Date().toISOString()}).select().single();
  if(error)return;
  notes.unshift(data);renderNotesList();selectNote(data.id);

function renderStatsApp(){
  const c=$('stats-inner');if(!c)return;
  const total=songs.length,pub=songs.filter(s=>s.estado==='Publicado').length;
  const enProg=songs.filter(s=>s.estado!=='Idea'&&s.estado!=='Publicado').length;
  const maxV=Math.max(...ESTADOS.map(e=>songs.filter(s=>s.estado===e).length),1);
  const bars=ESTADOS.map(e=>{
    const n=songs.filter(s=>s.estado===e).length;
    const pct=Math.round(n/maxV*100);
    return `<div class="bar-row"><span class="bar-lbl">${esc(e)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${ECOLORS[e]};"></div></div><span class="bar-val">${n}</span></div>`;
  }).join('');
  const amap={};songs.forEach(s=>(s.artistas||[]).forEach(a=>{amap[a]=(amap[a]||0)+1;}));
  const topA=Object.entries(amap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxA=Math.max(...topA.map(x=>x[1]),1);
  const aBars=topA.map(([n,c])=>`<div class="bar-row"><span class="bar-lbl">${esc(n)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(c/maxA*100)}%;background:#006633"></div></div><span class="bar-val">${c}</span></div>`).join('');

  // Monthly
  const mmap={};songs.forEach(s=>{const dt=s.creado||s.updated_at;if(!dt)return;const d=new Date(dt);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');mmap[k]=(mmap[k]||0)+1;});
  const mkeys=Object.keys(mmap).sort().slice(-6);
  const maxM=Math.max(...mkeys.map(k=>mmap[k]),1);
  const mBars=mkeys.map(k=>`<div class="bar-row"><span class="bar-lbl">${k}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(mmap[k]/maxM*100)}%;background:#800040"></div></div><span class="bar-val">${mmap[k]}</span></div>`).join('');

  c.innerHTML=`
    <div class="win-tb" style="margin:-10px -10px 10px;padding:4px 10px">
      <button class="rbtn" onclick="refreshStats()">↺ Actualizar</button>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-n">${total}</div><div class="kpi-l">Total temas</div></div>
      <div class="kpi"><div class="kpi-n">${pub}</div><div class="kpi-l">Publicados</div></div>
      <div class="kpi"><div class="kpi-n">${enProg}</div><div class="kpi-l">En progreso</div></div>
      <div class="kpi"><div class="kpi-n">${profiles.length}</div><div class="kpi-l">Miembros</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
      <div class="ss"><h3>Por estado</h3><div class="bar-chart">${bars}</div></div>
      <div class="ss"><h3>Top artistas</h3><div class="bar-chart">${aBars||'<div style="color:#666;font-size:11px">Sin datos</div>'}</div></div>
      <div class="ss"><h3>Temas por mes</h3><div class="bar-chart">${mBars||'<div style="color:#666;font-size:11px">Sin datos</div>'}</div></div>
    </div>
    <div class="ss"><h3>Últimas actualizaciones</h3>
      <table class="rtable"><thead><tr><th>Tema</th><th>Estado</th><th>Actualizado</th></tr></thead>
      <tbody>${songs.slice(0,8).map(s=>`<tr><td>${esc(s.titulo)}</td><td><span class="ebadge" style="background:${ECOLORS[s.estado]};color:${ETCOLORS[s.estado]};border-color:${ETCOLORS[s.estado]}">${esc(s.estado)}</span></td><td>${fmtDT(s.updated_at)}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;
}

// ===== PRODUCTION STAGES =====
const DEFAULT_STAGES_DEF=[
  {id:'beat',name:'Beat'},{id:'letra',name:'Letra'},{id:'vocal',name:'Vocal'},
  {id:'mezcla',name:'Mezcla'},{id:'master',name:'Máster'},{id:'arte',name:'Arte'},
  {id:'video',name:'Vídeo'},{id:'pub',name:'Publicación'}
];
function getDefaultStages(){return DEFAULT_STAGES_DEF.map(s=>({...s,done:false,assignee_id:'',assignee_name:''}));}
function songProgress(song){
  const st=song.production_stages||[];if(!st.length)return 0;
  return Math.round(st.filter(s=>s.done).length/st.length*100);
}
function toggleStage(i,done){
  if(!curSong.production_stages)curSong.production_stages=getDefaultStages();
  const st=curSong.production_stages[i];if(!st)return;
  const wasDone=st.done;st.done=done;
  if(done&&!wasDone)logActivity('stage_completada',curSong.id||'',curSong.titulo,{stage:st.name});
  renderMTabContent(curSong.id);
}
function assignStage(i,uid,uname){
  if(!curSong.production_stages)curSong.production_stages=getDefaultStages();
  const st=curSong.production_stages[i];if(!st)return;
  st.assignee_id=uid;st.assignee_name=uid?uname:'';
  renderMTabContent(curSong.id);
}

function renderActividad(){

      if(a.action==='estado_cambio'&&a.detail){detail=` <span style="color:#808080">${esc(a.detail.from||'')} → ${esc(a.detail.to||'')}</span>`;}
      if(a.action==='stage_completada'&&a.detail){detail=` <em>${esc(a.detail.stage||'')}</em>`;}

}

      <button class="rbtn" onclick="exportSprint()">📋 Exportar resumen</button>
      <span style="font-size:10px;color:#666;margin-left:6px">Marca los temas que trabajáis esta semana</span>
    </div>
    <div class="sprint-main">
      <div class="sprint-left">
        <div class="sprint-left-h">Todos los temas</div>
        <div id="sprint-list"></div>
      </div>
      <div class="sprint-right" id="sprint-board"></div>
    </div>
  </div>`);
  renderSprintList();renderSprintBoard();

function renderSprintList(){
  const c=$('sprint-list');if(!c)return;
  c.innerHTML=songs.map(s=>`
    <div class="sprint-song-item" onclick="toggleSprint('${s.id}',this)">
      <input type="checkbox" ${s.in_sprint?'checked':''} onclick="event.stopPropagation();toggleSprint('${s.id}',this.parentElement)">
      <span style="flex:1">${esc(s.titulo)}</span>
      <span style="font-size:9px;padding:1px 4px;background:${ECOLORS[s.estado]};color:${ETCOLORS[s.estado]}">${esc(s.estado)}</span>
    </div>`).join('');
}

async function toggleSprint(id,row){
  const s=songs.find(x=>x.id===id);if(!s)return;
  s.in_sprint=!s.in_sprint;
  const cb=row.querySelector('input[type=checkbox]');if(cb)cb.checked=s.in_sprint;
  await SB.from('songs').update({in_sprint:s.in_sprint}).eq('id',id);
  renderSprintBoard();
  if(wins['mipanel'])renderMiPanel();
}

function renderSprintBoard(){
  const c=$('sprint-board');if(!c)return;
  const sp=songs.filter(s=>s.in_sprint);
  if(!sp.length){c.innerHTML='<div style="padding:20px;color:#666;text-align:center">Selecciona temas de la lista de la izquierda para añadirlos al sprint.</div>';return;}
  c.innerHTML=sp.map(s=>{
    const stages=s.production_stages&&s.production_stages.length?s.production_stages:getDefaultStages();
    const pct=songProgress(s);
    const pendStages=stages.filter(st=>!st.done);
    // Group tasks by assignee
    const assigneeMap={};
    [...stages.filter(st=>!st.done&&st.assignee_name),...(s.tareas||[]).filter(t=>!t.done&&t.assignee_name)].forEach(item=>{
      const name=item.assignee_name;if(!assigneeMap[name])assigneeMap[name]=[];
      assigneeMap[name].push(item.name||item.texto);
    });
    return`<div class="sprint-card">
      <div class="sprint-card-title">🎵 ${esc(s.titulo)} <span style="font-weight:normal;font-size:10px;color:#666">${esc((s.artistas||[]).join(', '))}</span></div>
      <div style="display:flex;gap:8px;align-items:center;margin:4px 0">
        <div class="prog-mini" style="flex:1;height:6px"><div class="prog-mini-fill" style="width:${pct}%"></div></div>
        <span class="prog-pct">${pct}%</span>
        <span class="pt-badge" style="background:${ECOLORS[s.estado]};color:${ETCOLORS[s.estado]};border-color:${ETCOLORS[s.estado]};font-size:9px;padding:1px 5px;border:1px solid">${esc(s.estado)}</span>
      </div>
      <div class="sprint-stage-grid">
        ${stages.map(st=>`<div class="sprint-stage ${st.done?'done':'todo'}" title="${st.assignee_name?'→ '+st.assignee_name:''}">${esc(st.name)}</div>`).join('')}
      </div>
      ${Object.keys(assigneeMap).length?`<div style="margin-top:6px;font-size:10px;color:#444">
        ${Object.entries(assigneeMap).map(([who,tasks])=>`<div><strong>${esc(who)}</strong>: ${tasks.map(t=>esc(t)).join(', ')}</div>`).join('')}
      </div>`:''}
    </div>`;
  }).join('');
}

function exportSprint(){
  const sp=songs.filter(s=>s.in_sprint);
  if(!sp.length){notify('Sprint','No hay temas en el sprint','err');return;}
  const now=new Date();
  const semana=`Semana ${Math.ceil(now.getDate()/7)} - ${now.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}`;
  let txt=`🚀 SPRINT PERKYMAFIA\n${semana}\n${'─'.repeat(30)}\n\n`;
  sp.forEach(s=>{
    const stages=s.production_stages&&s.production_stages.length?s.production_stages:getDefaultStages();
    const pct=songProgress(s);
    txt+=`🎵 ${s.titulo}\n`;
    txt+=`   Estado: ${s.estado} | Progreso: ${pct}%\n`;
    const pend=stages.filter(st=>!st.done);
    if(pend.length)txt+=`   Pendiente: ${pend.map(st=>st.name+(st.assignee_name?' ('+st.assignee_name+')':'')).join(', ')}\n`;
    const tasks=(s.tareas||[]).filter(t=>!t.done);
    if(tasks.length)txt+=`   Tareas: ${tasks.map(t=>t.texto+(t.assignee_name?' → '+t.assignee_name:'')).join(', ')}\n`;
    txt+='\n';
  });
  navigator.clipboard.writeText(txt).then(()=>notify('Sprint','Resumen copiado al portapapeles ✅','ok')).catch(()=>{
    const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);a.download='sprint_perkymafia.txt';a.click();
  });
}
